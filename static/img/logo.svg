<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Logo ICAM Farmácia Pediátrica</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FB6A3"/>
      <stop offset="100%" stop-color="#1D8C8C"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- heartbeat pulse arc -->
  <path d="M14 66 h14 l6 -14 l8 22 l6 -30 l6 14 h46"
        fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bear ears -->
  <circle cx="38" cy="38" r="10" fill="#F6A65C"/>
  <circle cx="82" cy="38" r="10" fill="#F6A65C"/>
  <circle cx="38" cy="38" r="4.5" fill="#E8895C"/>
  <circle cx="82" cy="38" r="4.5" fill="#E8895C"/>

  <!-- bear head -->
  <circle cx="60" cy="58" r="26" fill="#FBC98A"/>

  <!-- snout -->
  <ellipse cx="60" cy="66" rx="11" ry="8" fill="#FFF3E1"/>
  <circle cx="60" cy="61" r="2.6" fill="#7A4B2A"/>

  <!-- eyes -->
  <circle cx="50" cy="54" r="2.8" fill="#5A3B24"/>
  <circle cx="70" cy="54" r="2.8" fill="#5A3B24"/>

  <!-- cheeks -->
  <circle cx="44" cy="62" r="4" fill="#F7B79A" fill-opacity="0.7"/>
  <circle cx="76" cy="62" r="4" fill="#F7B79A" fill-opacity="0.7"/>

  <!-- little cross patch (care symbol) -->
  <g transform="translate(75,44)">
    <circle r="9" fill="#ffffff"/>
    <rect x="-1.6" y="-5.5" width="3.2" height="11" rx="1" fill="#2FB6A3"/>
    <rect x="-5.5" y="-1.6" width="11" height="3.2" rx="1" fill="#2FB6A3"/>
  </g>
</svg>
